# Render Blueprint — optional one-click deploy from GitHub.
# Dashboard: https://dashboard.render.com
# Connect repo MrNtuli/DPermit and apply this blueprint, then set Supabase secrets in the UI.

services:
  - type: web
    name: digipermit-api
    runtime: node
    rootDir: digipermit-backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://mrntuli.github.io,https://mrntuli.github.io/DPermit
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
